<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資料作成｜提案書データ準備</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background:
      radial-gradient(circle at 0% 0%, #e6ebfb 0%, #ffffff 30%),
      radial-gradient(circle at 100% 0%, #fbe9ea 0%, #ffffff 30%),
      #ffffff;
    color: #1f2328;
    padding: 20px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .page-nav{position:fixed;top:22px;right:18px;z-index:300;display:flex;flex-direction:column;gap:10px}
  .pn-item{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid #e5e7eb;border-radius:14px;padding:11px 18px 11px 14px;font-size:13.5px;font-weight:600;color:#4b5563;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.09);transition:all .15s;white-space:nowrap}
  .pn-item:hover{border-color:#2563eb;color:#2563eb;transform:translateX(-3px)}
  .pn-item.active{background:#2563eb;border-color:#2563eb;color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.35);cursor:default}
  .pn-icon{font-size:18px;line-height:1}
  @media (max-width:1300px){.page-nav{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;margin:0 0 16px}}
  .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; }
  .row .field { flex: 1; }
  label { display: block; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 4px; }
  input[type="text"], input[type="date"], select, textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    background: #fff;
    color: #1f2328;
  }
  textarea { resize: vertical; height: 80px; }
  .card {
    border: 1px solid #e5e7eb;
    border-left: 4px solid var(--card-accent, #d1d5db);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 14px;
    background: var(--card-tint, #fafafa);
  }
  .card-title {
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
    color: #111827;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: var(--card-accent, #9ca3af);
    flex-shrink: 0;
  }
  .card-note { font-size: 11px; color: #6b7280; margin-bottom: 10px; }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
  }
  .btn-primary { background: #2563eb; }
  .btn-secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .btn-row { display: flex; gap: 10px; align-items: center; margin-top: 6px; }
  .status { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .status.ok { color: #15803d; }
  .status.err { color: #b91c1c; }
  .status.pending { color: #6b7280; }
  .chk-field { margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .chk-field input[type="checkbox"] { width: auto; }
  .chk-field label { margin: 0; font-weight: 400; font-size: 12px; color: #4b5563; }
</style>
</head>
<body>
<div class="page-nav">
  <a href="office.html" class="pn-item"><span class="pn-icon">🏢</span>オフィス</a>
  <a href="index.html" class="pn-item"><span class="pn-icon">📝</span>商談メモ</a>
  <a href="tasks.html" class="pn-item"><span class="pn-icon">✅</span>タスク管理</a>
  <span class="pn-item active"><span class="pn-icon">📄</span>資料作成</span>
</div>
<div class="wrap">
  <div class="title">資料作成｜提案書データ準備</div>
  <div class="subtitle">ここでまとめた内容を、Claude Codeの<code>sales-proposal</code>スキルに貼り付けて提案書pptxを作成します。このページ自体はデータの整形・コピーまでで、提案書の生成はClaude Code側で行います。</div>

  <div class="card" style="--card-accent:#2563eb;--card-tint:#eef2ff;">
    <div class="card-title"><span class="card-num">1</span>基本情報</div>
    <div class="row">
      <div class="field">
        <label>商談日</label>
        <input type="date" id="dealDate">
      </div>
      <div class="field">
        <label>会社名・案件名</label>
        <input type="text" id="dealName" placeholder="例: 株式会社◯◯様">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>弊社担当者（メンション）</label>
        <select id="assignee"></select>
      </div>
      <div class="field">
        <label>商材</label>
        <select id="proposalProduct">
          <option value="meo-dashboard">MEO Dashboard byGMO</option>
          <option value="local-geo-dash">Local GEO Dash! byGMO（MEO Dashboardとセット）</option>
          <option value="other">その他（未登録の商材）</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>商談フェーズ</label>
        <select id="proposalPhase">
          <option value="初回ヒアリング">初回ヒアリング</option>
          <option value="再提案">再提案</option>
          <option value="クロージング前">クロージング前</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card" style="--card-accent:#6366f1;--card-tint:#eef0fe;">
    <div class="card-title"><span class="card-num">2</span>文字起こし・議事録を貼り付け</div>
    <textarea id="transcript" style="height:160px;" placeholder="商談の文字起こし・議事録をここに貼り付けてください"></textarea>
  </div>

  <div class="card" style="--card-accent:#7c3aed;--card-tint:#f5f0fe;">
    <div class="card-title"><span class="card-num">3</span>相手企業情報</div>
    <div class="row">
      <div class="field">
        <label>業種・規模</label>
        <input type="text" id="proposalIndustryScale" placeholder="例: 飲食（焼き鳥居酒屋）・関東18店舗">
      </div>
      <div class="field">
        <label>Webサイト</label>
        <input type="text" id="proposalWebsite" placeholder="https://example.co.jp">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>先方の決裁者（氏名・役職）</label>
        <input type="text" id="proposalDecisionMaker" placeholder="例: 田村様（総務部長）">
      </div>
      <div class="field">
        <label>先方の担当者（氏名・役職）</label>
        <input type="text" id="proposalContactPerson" placeholder="例: 石田様（店舗運営マネージャー）">
      </div>
    </div>
  </div>

  <div class="card" style="--card-accent:#0e7490;--card-tint:#eafafb;">
    <div class="card-title"><span class="card-num">4</span>商談条件</div>
    <div class="row">
      <div class="field">
        <label>予算感</label>
        <input type="text" id="proposalBudget" placeholder="例: 月20万円まで">
      </div>
      <div class="field">
        <label>希望導入時期</label>
        <input type="text" id="proposalTimeline" placeholder="例: 未定／◯月から等">
      </div>
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>比較検討状況</label>
      <input type="text" id="proposalCompetitorStatus" placeholder="例: 他社比較検討なし・初回相談 等">
    </div>
    <div class="field" style="margin-bottom:10px;">
      <label>プラン方針（分かれば）</label>
      <input type="text" id="proposalPlanPolicy" placeholder="例: 内製化志向（ツール提供+CSサポート型が合いそう）">
    </div>
  </div>

  <div class="card" style="--card-accent:#0f766e;--card-tint:#ecfdf5;">
    <div class="card-title"><span class="card-num">5</span>その他・提供できるデータ</div>
    <div class="field" style="margin-bottom:10px;">
      <label>参考にしたい過去の類似支援実績（あれば）</label>
      <input type="text" id="proposalPastCases" placeholder="例: 東横イン様、花キューピット様 等">
    </div>

    <div class="card-note" style="margin-top:2px;">以下は、渡せるデータがある場合だけチェックしてください。チェックが無い項目は「※未提供」として提案書側にプレースホルダーが作られます。</div>
    <div class="chk-field">
      <input type="checkbox" id="proposalChkDiagnosis">
      <label for="proposalChkDiagnosis">診断データ（GBP診断結果・Ahrefs Brand Radar等）がある</label>
    </div>
    <div class="chk-field">
      <input type="checkbox" id="proposalChkCompetitor">
      <label for="proposalChkCompetitor">競合比較データがある（比較検討中の他社名など）</label>
    </div>
    <div class="chk-field">
      <input type="checkbox" id="proposalChkEffect">
      <label for="proposalChkEffect">効果試算のもとになる先方の実データがある（表示回数・アクション数等）</label>
    </div>
    <div class="chk-field" style="margin-bottom:10px;">
      <input type="checkbox" id="proposalChkQA">
      <label for="proposalChkQA">想定Q&Aを含めたい</label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="copyProposalDataBtn">提案書用データをコピー</button>
      <span class="status pending" id="proposalExportStatus"></span>
    </div>
  </div>
</div>

<script src="constants.js"></script>
<script src="proposal-export.js"></script>
</body>
</html>
