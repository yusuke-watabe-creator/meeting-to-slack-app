<script src="config.js"></script>
<script src="constants.js"></script>
<script src="calendar.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F0EFE9;--surface:#FFF;--surface2:#EFEDE6;
  --border:#E2DFD6;--border2:#C9C6BC;
  --text:#18171A;--text2:#5C5A62;--text3:#9B99A4;
  --accent:#3A5EE5;--r12:12px;--r16:16px;--r8:8px;
  --font:"Instrument Sans",sans-serif;--mono:monospace;
  --cn:#3A5EE5;--cm:#1A7A50;--cs:#C0253A;--ct:#6B35C8;
  --shadow:0 1px 4px rgba(0,0,0,.07),0 0 1px rgba(0,0,0,.06);
  --floor:#E4DCC8;--floor2:#DCD3BC;--wood:#C9A876;--wood2:#BE9A63;
}
body{
  font-family:var(--font);color:var(--text);min-height:100vh;font-size:14px;
  background:
    radial-gradient(circle at 0% 0%,#e6ebfb 0%,var(--bg) 32%),
    radial-gradient(circle at 100% 0%,#fbe9ea 0%,var(--bg) 32%),
    var(--bg);
}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:9px}
.brand-icon{width:28px;height:28px;background:var(--accent);border-radius:var(--r8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.brand-name{font-size:15px;font-weight:600}
.nav-link{font-size:13px;color:var(--accent);text-decoration:none}
.cal-btn{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--surface2);border:none;border-radius:20px;padding:5px 12px;cursor:pointer;font-family:var(--font)}
.cal-btn.connected{color:#1A7A50;background:#E8F5EE;cursor:default}
.cal-btn:disabled{opacity:.6;cursor:default}
.page-nav{position:fixed;top:70px;right:18px;z-index:60;display:flex;flex-direction:column;gap:10px}
.pn-item{display:flex;align-items:center;gap:9px;background:var(--surface);border:1.5px solid var(--border2);border-radius:14px;padding:11px 18px 11px 14px;font-size:13.5px;font-weight:600;color:var(--text2);text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.09);transition:all .15s;white-space:nowrap}
.pn-item:hover{border-color:var(--accent);color:var(--accent);transform:translateX(-3px)}
.pn-item.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(58,94,229,.35);cursor:default}
.pn-icon{font-size:18px;line-height:1}
@media (max-width:1300px){.page-nav{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;margin:10px 20px 0}}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px}
.stage-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r16);box-shadow:var(--shadow);padding:16px;overflow-x:auto}

/* ---- room ---- */
.room-scene{position:relative;width:700px;margin:0 auto}
.room{
  position:relative;width:700px;height:470px;border-radius:0 0 var(--r12) var(--r12);overflow:hidden;
  background-image:
    linear-gradient(90deg, rgba(0,0,0,.025) 1px, transparent 1px),
    linear-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
  background-size:20px 20px;
  background-color:var(--floor);
  border:2px solid var(--border2);
}
.floor-contact-shadow{position:absolute;left:0;right:0;top:0;height:34px;background:linear-gradient(180deg,rgba(0,0,0,.12),transparent);pointer-events:none}

/* ---- back wall: gives the room a sense of depth/enclosure ---- */
.wall-back{
  position:relative;width:700px;height:150px;border-radius:var(--r12) var(--r12) 0 0;overflow:hidden;
  background:linear-gradient(180deg,#F3EEE0 0%,#F3EEE0 62%,#DCD0B4 62%,#DCD0B4 100%);
  border:2px solid var(--border2);border-bottom:none;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.5);
}
.wall-back::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,18,30,.16),transparent 170px);pointer-events:none}
.wall-back::after{content:"";position:absolute;left:0;right:0;top:96px;height:2px;background:rgba(0,0,0,.12)}
.ceiling-light{position:absolute;top:8px;width:14px;height:14px;border-radius:50%;background:radial-gradient(#FFFBEA,#FFD98A);box-shadow:0 0 16px 6px rgba(255,217,138,.5)}
.window{position:absolute;top:16px;width:80px;height:80px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#BFE0F5,#EAF6FF);border:4px solid #fff;box-shadow:0 0 0 1px var(--border2)}
.window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.85);transform:translateX(-50%)}
.window::after{content:"";position:absolute;top:50%;left:0;right:0;height:2px;background:rgba(255,255,255,.85);transform:translateY(-50%)}
.wall-clock{position:absolute;top:18px;width:42px;height:42px;border-radius:50%;background:#fff;border:3px solid #2B2F38;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.wall-clock::before{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;background:#2B2F38;border-radius:50%;transform:translate(-50%,-50%);z-index:1}
.clock-hand{position:absolute;left:50%;bottom:50%;background:#2B2F38;transform-origin:bottom center}
.clock-hand.hh{width:2px;height:9px;transform:translateX(-50%) rotate(50deg)}
.clock-hand.mh{width:1.5px;height:13px;transform:translateX(-50%) rotate(140deg)}
.target-board{position:absolute;left:20px;top:14px;width:225px;z-index:2;background:#FFFDF6;border:3px solid var(--wood2);border-radius:5px;box-shadow:0 3px 8px rgba(0,0,0,.2);padding:8px 13px 9px}
.target-board-title{font-size:12px;font-weight:700;color:var(--text2);text-align:center;margin-bottom:6px;padding-bottom:5px;border-bottom:1px dashed var(--border2)}
.target-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);padding:2.5px 0}
.target-row .t-name{font-weight:600;color:var(--text2);white-space:nowrap}
.target-row .t-val{font-family:var(--mono);font-weight:700;color:var(--text);white-space:nowrap}
.target-row.total{border-bottom:1px dashed var(--border2);padding-bottom:5px;margin-bottom:3px}
.target-row.total .t-name{color:var(--text);font-weight:700}
.target-row.total .t-val{color:var(--accent);font-size:15px}
.target-row.sub{padding:0 0 4px;font-size:11px;color:var(--text3)}
.target-row.sub .t-val{font-size:11px;color:var(--text3);font-weight:600}
.wall-back-shadow-r{position:absolute;top:0;right:0;bottom:0;width:110px;background:linear-gradient(270deg,rgba(20,18,30,.14),transparent);pointer-events:none}
.wall-door{position:absolute;left:600px;top:30px;width:70px;height:120px;background:linear-gradient(90deg,#8B5A2B,#A97142 14%,#8B5A2B 86%,#6B4423);border:3px solid #4A3018;border-top-left-radius:4px;border-top-right-radius:4px;box-shadow:2px 5px 10px rgba(0,0,0,.3)}
.wall-door::before{content:"";position:absolute;left:7px;right:7px;top:9px;height:46px;background:rgba(0,0,0,.14);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.wall-door::after{content:"";position:absolute;left:7px;right:7px;top:61px;bottom:9px;background:rgba(0,0,0,.14);border-radius:2px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.wall-door-edge{position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(90deg,#3A2410,#6B4423)}
.wall-door-knob{position:absolute;right:8px;top:56%;width:7px;height:7px;border-radius:50%;background:#F4D06F;box-shadow:0 1px 2px rgba(0,0,0,.45)}
.door-floor-shadow{position:absolute;left:598px;top:0;width:76px;height:14px;background:radial-gradient(ellipse at center,rgba(0,0,0,.22),transparent 70%);pointer-events:none}

/* ---- floor decor: cabinet + extra plant, in the open gap between the two zones ---- */
.cabinet{position:absolute;left:300px;top:260px;width:100px;height:120px;background:var(--wood2);border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cabinet .shelf-line{position:absolute;left:6px;right:6px;height:3px;background:rgba(0,0,0,.18)}
.cabinet .cbook{position:absolute;bottom:4px;border-radius:1px}

.zone{position:absolute;border-radius:10px;display:flex;flex-direction:column}
.zone-break{left:16px;top:220px;width:210px;height:220px;background:#EAF3DE;border:2px dashed #C3D9A0}
.zone-meeting{left:460px;top:220px;width:224px;height:220px;background:#EEF0FC;border:2px dashed #C3CCF2}

/* desks (fixed furniture, top row) */
.furniture-desk{position:absolute;top:56px;width:96px;height:34px}
.furniture-desk .surface{position:absolute;inset:0;background:#D8D4C8;border-radius:5px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.furniture-desk .monitor{position:absolute;left:32px;top:-16px;width:32px;height:20px;background:#4b5563;border-radius:3px}
.furniture-desk .monitor::after{content:"";position:absolute;left:12px;bottom:-6px;width:8px;height:6px;background:#4b5563}
.furniture-desk .label{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:10px;font-weight:700;color:var(--text3)}

/* meeting table + chairs */
.meeting-table{position:absolute;left:508px;top:300px;width:130px;height:60px;background:var(--wood);border:3px solid var(--wood2);border-radius:14px;z-index:1}
.chair{position:absolute;width:24px;height:22px}
.chair .seat{position:absolute;left:2px;right:2px;bottom:0;height:14px;background:#ABA394;border-radius:4px}
.chair.face-down .back{position:absolute;left:3px;right:3px;top:0;height:9px;background:#877E6E;border-radius:4px 4px 0 0}
.chair.face-up .back{position:absolute;left:3px;right:3px;bottom:0;height:9px;background:#877E6E;border-radius:0 0 4px 4px}

/* break furniture */
.coffee-machine{position:absolute;left:36px;top:250px;width:34px;height:44px;background:#6b7280;border-radius:6px 6px 3px 3px}
.coffee-machine::before{content:"";position:absolute;left:8px;top:-6px;width:18px;height:8px;background:#4b5563;border-radius:3px 3px 0 0}
.plant-pot{position:absolute;left:170px;top:340px;width:28px;height:22px;background:#A05C00;border-radius:4px 4px 8px 8px}
.plant-leaf{position:absolute;left:172px;top:312px;width:24px;height:30px;background:#3B6D11;border-radius:60% 40% 60% 40%}

.sofa{position:absolute;left:60px;top:380px;width:150px;height:46px}
.sofa .sofa-back{position:absolute;left:0;right:0;top:0;height:20px;background:#A66A3D;border-radius:8px 8px 0 0}
.sofa .sofa-seat{position:absolute;left:0;right:0;bottom:0;height:26px;background:#C98A54;border-radius:6px}
.sofa .sofa-arm-l{position:absolute;left:-7px;top:4px;bottom:0;width:14px;background:#A66A3D;border-radius:6px}
.sofa .sofa-arm-r{position:absolute;right:-7px;top:4px;bottom:0;width:14px;background:#A66A3D;border-radius:6px}

.vending{position:absolute;left:186px;top:236px;width:32px;height:70px;background:#1D4ED8;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.vending .vending-window{position:absolute;left:4px;top:6px;right:4px;height:36px;background:#DCE5FA;border-radius:2px;overflow:hidden}
.vending .vending-window::after{content:"";position:absolute;left:2px;right:2px;top:6px;height:1.5px;background:#93A5C9;box-shadow:0 6px 0 #93A5C9,0 12px 0 #93A5C9,0 18px 0 #93A5C9,0 24px 0 #93A5C9}
.vending .vending-slot{position:absolute;left:6px;right:6px;bottom:6px;height:10px;background:#0F2A9E;border-radius:2px}

/* ---- character sprite ---- */
.person{position:absolute;width:52px;height:80px;transform:translate(-50%,-100%);z-index:5;cursor:pointer}
.person-inner{position:relative;width:100%;height:100%}
.mood-icon{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:14px;opacity:0;transition:opacity .2s}
.mood-icon.show{opacity:1}
.name-tag{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--text2);background:rgba(255,255,255,.85);padding:0px 5px;border-radius:8px;white-space:nowrap}
.char{overflow:visible;display:block}
.facing-left .char{transform:scaleX(-1)}
.leg{transform-origin:top center}
@keyframes walkLeg{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.walking .leg-l{animation:walkLeg .38s ease-in-out infinite}
.walking .leg-r{animation:walkLeg .38s ease-in-out infinite .19s}
@keyframes bodyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.walking .body-grp{animation:bodyBob .38s ease-in-out infinite}
.state-idle:not(.walking) .body-grp{animation:bob 2.6s ease-in-out infinite}
.state-meeting:not(.walking) .body-grp{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-2px) rotate(-2deg)}75%{transform:translateX(2px) rotate(2deg)}}
.state-overdue:not(.walking) .body-grp{animation:shake .35s ease-in-out infinite}
@keyframes sweatDrip{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(10px)}}
.state-overdue .sweat{animation:sweatDrip 1.1s ease-in infinite}
.sweat{opacity:0}
.mouth{display:none}
.state-idle .mouth-neutral,.state-working .mouth-happy,.state-overdue .mouth-worried,.state-meeting .mouth-neutral{display:block}
.brow{display:none}
.state-overdue .brow{display:block}

@keyframes celebrate{0%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes sparklePop{0%{opacity:0;transform:translateY(6px) scale(.4)}30%{opacity:1;transform:translateY(-10px) scale(1)}100%{opacity:0;transform:translateY(-26px) scale(.6)}}
.celebrating .body-grp{animation:celebrate .6s ease}
.sparkle{position:absolute;font-size:18px;opacity:0;pointer-events:none}
.celebrating .sparkle{animation:sparklePop .9s ease}
.sparkle-1{left:2px;top:6px}
.sparkle-2{left:20px;top:-4px}
.sparkle-3{left:38px;top:6px}

/* ---- legend / status strip ---- */
.legend{display:flex;justify-content:space-around;gap:8px;margin-top:16px;flex-wrap:wrap}
.legend-item{text-align:center;flex:1;min-width:130px;cursor:pointer}
.legend-role{display:inline-block;font-size:10px;font-weight:700;font-family:var(--mono);color:var(--role-color,var(--text3));background:var(--surface2);padding:1px 8px;border-radius:20px;letter-spacing:.04em}
.legend-name{font-size:13px;font-weight:600;margin-top:4px}
.legend-status{font-size:11.5px;color:var(--text2);margin-top:2px;min-height:15px}
.legend-badges{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;font-family:var(--mono)}
.badge-count{background:var(--surface2);color:var(--text2)}
.badge-due{background:#FEF4E3;color:#A05C00}
.badge-due.over{background:#FDEAED;color:#C0253A}
.badge-due.today{background:#FEF4E3;color:#A05C00}
.badge-ok{background:#E8F5EE;color:#1A7A50}

/* ---- person detail modal ---- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s;backdrop-filter:blur(2px)}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border-radius:var(--r16);box-shadow:0 12px 40px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);width:400px;max-width:92vw;padding:22px;transform:translateY(8px) scale(.98);transition:transform .18s;max-height:82vh;overflow-y:auto}
.overlay.open .modal{transform:none}
.dh{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.dh-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.dh-info{flex:1;min-width:0}
.dh-name{font-size:16px;font-weight:600}
.dh-role{font-size:11px;color:var(--text3);font-weight:600;font-family:var(--mono)}
.dc{width:28px;height:28px;border-radius:var(--r8);border:none;background:var(--surface2);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.dh-status{font-size:12.5px;color:var(--text2);margin-bottom:16px;padding:9px 12px;background:var(--surface2);border-radius:var(--r8)}
.dlbl{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:8px}

/* ---- sales progress ---- */
.sales-summary{margin:0 0 14px;padding:12px 14px;background:var(--surface2);border-radius:var(--r12)}
.sales-summary-label{font-size:12px;font-weight:700;color:var(--text2);margin-bottom:7px}
.sales-summary-bar{height:10px;border-radius:20px;background:var(--border);overflow:hidden}
.sales-summary-fill{height:100%;background:linear-gradient(90deg,#3A5EE5,#6B8CFF);border-radius:20px;transition:width .4s ease;width:0%}
.sales-summary-text{font-size:12px;color:var(--text2);margin-top:7px}
.sales-summary-text .num{font-family:var(--mono);font-weight:700;color:var(--text)}
.legend-sales{margin-top:8px}
.sales-bar{height:6px;border-radius:10px;background:var(--border);overflow:hidden}
.sales-fill{height:100%;background:linear-gradient(90deg,#3A5EE5,#6B8CFF);border-radius:10px;transition:width .4s ease;width:0%}
.sales-fill.over{background:linear-gradient(90deg,#1A7A50,#2FBE7E)}
.sales-text{font-size:10.5px;color:var(--text2);margin-top:3px}
.sales-detail{font-size:13px;color:var(--text2);background:var(--surface2);border-radius:var(--r8);padding:9px 12px;margin-bottom:8px}
.sales-detail b{color:var(--text);font-family:var(--mono)}
.task-row{padding:9px 11px;background:var(--surface2);border-radius:var(--r8);margin-bottom:7px}
.task-row-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.task-name{font-size:13px;font-weight:600}
.task-memo{font-size:11.5px;color:var(--text2);line-height:1.5;margin-top:4px}
.empty-tasks{font-size:12.5px;color:var(--text3);text-align:center;padding:22px 0}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.btn{border:none;border-radius:var(--r8);padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);text-decoration:none;display:inline-flex;align-items:center}
.btn-ghost{background:var(--surface2);color:var(--text2)}
.btn-primary{background:var(--accent);color:#fff}
.qa-form{display:flex;flex-direction:column;gap:7px}
.qinp{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:var(--r8);font-family:var(--font);font-size:13px;color:var(--text);background:var(--surface);outline:none;transition:border-color .14s}
textarea.qinp{resize:vertical;min-height:44px;line-height:1.4}
.qinp:focus{border-color:var(--accent)}
.qa-row{display:flex;gap:7px;align-items:center}
.qsel{flex:1;padding:7px 9px;border:1.5px solid var(--border);border-radius:var(--r8);font-family:var(--font);font-size:12px;color:var(--text);background:var(--surface);outline:none}
.qsel:focus{border-color:var(--accent)}

/* ---- subcontractor workshop (MEO資料作成会社) ---- */
.sub-wrap{max-width:960px;margin:0 auto;padding:0 20px 32px}
.sub-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sub-title{font-size:15px;font-weight:600}
.sub-sub{font-size:11.5px;color:var(--text3);margin-top:2px}

.workshop{

.workshop-shelf{position:absolute;left:26px;top:104px;width:132px;height:172px}

.paper-sheet{position:absolute;left:0;width:120px;height:15px;background:#F3EEDD;border:1px solid #CBBF9C;border-radius:1px;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.paper-sheet::before{content:"";position:absolute;left:8px;right:24px;top:5px;height:1.5px;background:#CBBF9C}
.paper-sheet::after{content:"";position:absolute;left:8px;right:40px;top:9px;height:1.5px;background:#CBBF9C}
.inbox-stack{position:absolute;right:6px;bottom:100%;width:56px;height:40px}

.craftsman{position:absolute;left:305px;top:104px;width:130px;height:110px;z-index:2}
@keyframes craftBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.craftsman-body{animation:craftBob 3.2s ease-in-out infinite}
@keyframes penWiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
.pen-arm{transform-origin:112px 76px;animation:penWiggle 1s ease-in-out infinite}
.craftsman.overloaded .pen-arm{animation-duration:.45s}
.craftsman .sweat{opacity:0}
.craftsman.overloaded .sweat{animation:sweatDrip 1.1s ease-in infinite}
.craftsman .mouth-calm{display:block}
.craftsman .mouth-strained{display:none}
.craftsman.overloaded .mouth-calm{display:none}
.craftsman.overloaded .mouth-strained{display:block}

function today() { return new Date().toISOString().split('T')[0]; }

function fmtDue(s) {
  if (!s) return null;
  const d = new Date(s + 'T00:00:00'), t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((d - t) / 86400000);
  if (diff < 0) return { label: Math.abs(diff) + '日超過', cls: 'over' };
  if (diff === 0) return { label: '今日', cls: 'today' };
  if (diff === 1) return { label: '明日', cls: '' };
  return { label: d.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }), cls: '' };
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function priorityIcon(pr) {

  document.getElementById('pm-role').textContent = p.role;
  const taskStatus =
    overdue.length ? `⚠️ 期限切れのタスクが${overdue.length}件あります` :
    mine.length ? `${mine.length}件のタスクに対応中です` :
    'タスクはありません。のんびり中です';
  document.getElementById('pm-status').textContent =
    c && c.inMeeting ? `📅 現在、会議中です` : taskStatus;

  const s = salesData[key] || {};
  const target = s.target || 0, current = s.current || 0;
  const remain = Math.max(0, target - current);
  document.getElementById('sales-detail').innerHTML = target > 0
    ? `目標 <b>${fmtMan(target)}</b>　実績 <b>${fmtMan(current)}</b>　残り <b>${fmtMan(remain)}</b>`
    : '目標が未設定です';
  document.getElementById('sales-target-input').value = target || '';
  document.getElementById('sales-current-input').value = current || '';

  const sorted = mine.slice().sort((a, b) => {
    if (!a.due && !b.due) return 0;
    if (!a.due) return 1;
    if (!b.due) return -1;
    return a.due.localeCompare(b.due);
  });
  const list = document.getElementById('pm-tasks');
  list.innerHTML = sorted.length ? sorted.map(t => {
    const due = t.due ? fmtDue(t.due) : null;
    return `<div class="task-row">
      <div class="task-row-top">
        <div class="task-name">${priorityIcon(t.priority)}${escHtml(t.name || '')}</div>
        ${due ? `<span class="badge badge-due ${due.cls}">📅 ${due.label}</span>` : ''}
      </div>
      ${t.memo ? `<div class="task-memo">${escHtml(t.memo)}</div>` : ''}
      ${t.assignedBy ? `<div class="task-memo">📋 指示者: ${escHtml(t.assignedBy)}</div>` : ''}
    </div>`;
  }).join('') : `<div class="empty-tasks">タスクはありません</div>`;

  document.getElementById('person-modal').classList.add('open');
}

let salesData = {};

function fmtMan(n) {
  return Math.round(n || 0).toLocaleString('ja-JP') + '万円';
}

function fbSetSales(key, data) {
  const { db, ref, set } = window._fb;
  set(ref(db, 'team2/sales/' + key), data);
}

function renderSalesUI() {
  let totalTarget = 0, totalCurrent = 0;
  PEOPLE.forEach(p => {
    const s = salesData[p.key] || {};
    totalTarget += s.target || 0;
    totalCurrent += s.current || 0;
  });

  // 進捗表: 渡部(社長)の行はチーム合算値(=会社全体の目標)を表示し、自分個人の実績は別行で添える。
  const boardEl = document.getElementById('target-board-rows');
  if (boardEl) {
    const boss = PEOPLE.find(p => p.role === '社長');
    let rows = '';
    if (boss) {
      const bossPersonal = salesData[boss.key] || {};
      rows += `<div class="target-row total"><span class="t-name">${escHtml(boss.key)}(社長)</span><span class="t-val">${totalCurrent}/${totalTarget}万</span></div>`;
      rows += `<div class="target-row sub"><span class="t-name">└自分</span><span class="t-val">${bossPersonal.current || 0}/${bossPersonal.target || 0}万</span></div>`;
    }
    rows += PEOPLE.filter(p => p !== boss).map(p => {
      const s = salesData[p.key] || {};
      return `<div class="target-row"><span class="t-name">${escHtml(p.key)}</span><span class="t-val">${s.current || 0}/${s.target || 0}万</span></div>`;
    }).join('');
    boardEl.innerHTML = rows;
  }

  PEOPLE.forEach(p => {
    const s = salesData[p.key] || {};
    const target = s.target || 0, current = s.current || 0;
    const pct = target > 0 ? Math.min(100, Math.round((current / target) * 100)) : 0;
    const remain = Math.max(0, target - current);
    const c = chars[p.key];
    if (!c) return;
    if (c.salesFillEl) {
      c.salesFillEl.style.width = pct + '%';
      c.salesFillEl.classList.toggle('over', target > 0 && current >= target);
    }
    if (c.salesTextEl) {
      c.salesTextEl.textContent = target > 0 ? `残り ${fmtMan(remain)}` : '目標未設定';
    }
  });
  const totalPct = totalTarget > 0 ? Math.min(100, Math.round((totalCurrent / totalTarget) * 100)) : 0;
  const totalRemain = Math.max(0, totalTarget - totalCurrent);
  document.getElementById('sales-summary-fill').style.width = totalPct + '%';
  document.getElementById('sales-summary-text').innerHTML = totalTarget > 0
    ? `目標 <span class="num">${fmtMan(totalTarget)}</span>　実績 <span class="num">${fmtMan(totalCurrent)}</span>　残り <span class="num">${fmtMan(totalRemain)}</span>（${totalPct}%）`
    : 'まだ目標が設定されていません';
}

function saveSales() {
  const target = Number(document.getElementById('sales-target-input').value) || 0;
  const current = Number(document.getElementById('sales-current-input').value) || 0;
  salesData[currentModalKey] = { target, current };
  fbSetSales(currentModalKey, { target, current });
  renderSalesUI();
  openPersonModal(currentModalKey);
}

function initSales() {
  const { db, ref, onValue } = window._fb;
  onValue(ref(db, 'team2/sales'), snap => {
    salesData = snap.val() || {};
    renderSalesUI();
  });
}

function closePersonModal() {
  document.getElementById('person-modal').classList.remove('open');
}

function fbSetTask(t) {
  const { db, ref, set } = window._fb;
  set(ref(db, 'team2/tasks/' + t.id), t);
}

function quickAddTask() {
  const nameEl = document.getElementById('qa-name');
  const name = nameEl.value.trim();
  if (!name) {
    nameEl.style.borderColor = 'var(--red, #C0253A)';
    nameEl.focus();
    setTimeout(() => nameEl.style.borderColor = '', 1500);
    return;
  }
  const task = {
    id: Date.now(),
    createdAt: Date.now(),
    name,
    memo: document.getElementById('qa-memo').value.trim(),
    cat: '',
    priority: document.getElementById('qa-priority').value,
    due: document.getElementById('qa-due').value,
    dueTime: '',
    assignee: currentModalKey,
    assignedBy: document.getElementById('qa-by').value
  };
  allTasks.push(task);
  fbSetTask(task);

  nameEl.value = '';
  document.getElementById('qa-memo').value = '';
  document.getElementById('qa-priority').value = '';
  document.getElementById('qa-due').value = '';
  openPersonModal(currentModalKey);
}

function openBroadcastModal() {
  document.getElementById('broadcast-target-list').textContent =
    '追加先: ' + PEOPLE.map(p => p.key).join('・') + '（' + PEOPLE.length + '名）';
  document.getElementById('bc-name').value = '';
  document.getElementById('bc-memo').value = '';
  document.getElementById('bc-priority').value = '';
  document.getElementById('bc-due').value = '';
  document.getElementById('broadcast-modal').classList.add('open');
  setTimeout(() => document.getElementById('bc-name').focus(), 180);
}

function closeBroadcastModal() {
  document.getElementById('broadcast-modal').classList.remove('open');
}

function submitBroadcast() {
  const nameEl = document.getElementById('bc-name');
  const name = nameEl.value.trim();
  if (!name) {
    nameEl.style.borderColor = 'var(--red, #C0253A)';
    nameEl.focus();
    setTimeout(() => nameEl.style.borderColor = '', 1500);
    return;
  }
  const memo = document.getElementById('bc-memo').value.trim();
  const priority = document.getElementById('bc-priority').value;
  const due = document.getElementById('bc-due').value;
  const assignedBy = document.getElementById('bc-by').value;
  const baseId = Date.now();

  PEOPLE.forEach((p, i) => {
    const task = {
      id: baseId + i,
      createdAt: baseId,
      name,
      memo,
      cat: '',
      priority,
      due,
      dueTime: '',
      assignee: p.key,
      assignedBy
    };
    allTasks.push(task);
    fbSetTask(task);
  });

  closeBroadcastModal();
}

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePersonModal(); closeBroadcastModal(); }
});

function buildRoom() {
  const room = document.getElementById('room');
  const legend = document.getElementById('legend');

  PEOPLE.forEach(p => {
    const deskEl = document.createElement('div');
    deskEl.className = 'furniture-desk';
    deskEl.style.left = (p.deskX - 48) + 'px';
    deskEl.style.top = p.deskY + 'px';
    deskEl.innerHTML = `<div class="surface"></div><div class="monitor"></div><div class="label">${p.key}</div>`;
    room.appendChild(deskEl);

    const personEl = document.createElement('div');
    personEl.className = 'person state-idle';
    personEl.innerHTML = `
      <div class="person-inner">
        <span class="mood-icon">🥱</span>
        ${charSVG(p.color, p.female, p.suit)}
        <span class="sparkle sparkle-1">✨</span>
        <span class="sparkle sparkle-2">🎉</span>
        <span class="sparkle sparkle-3">✨</span>
        <span class="name-tag">${p.key}</span>
      </div>
    `;
    personEl.addEventListener('click', () => openPersonModal(p.key));
    room.appendChild(personEl);

    const legendEl = document.createElement('div');
    legendEl.className = 'legend-item';
    legendEl.innerHTML = `
      <div class="legend-role" style="--role-color:${p.color};">${p.role}</div>
      <div class="legend-name">${p.key}</div>
      <div class="legend-status"></div>
      <div class="legend-badges"></div>
      <div class="legend-sales">
        <div class="sales-bar"><div class="sales-fill"></div></div>
        <div class="sales-text"></div>
      </div>
    `;
    legendEl.addEventListener('click', () => openPersonModal(p.key));
    legend.appendChild(legendEl);

    chars[p.key] = {
      def: p,
      el: personEl,
      legendEl,
      salesFillEl: legendEl.querySelector('.sales-fill'),
      salesTextEl: legendEl.querySelector('.sales-text'),
      x: p.deskX, y: p.standY,
      targetX: p.deskX, targetY: p.standY,
      mood: 'idle',
      celebrateUntil: 0,
      prevCount: 0,
      inMeeting: false,
      meetingSeat: null,
      taskIcon: '🥱',
      taskStatusText: 'のんびり中'
    };
  });
}

function applyData(tasks) {
  allTasks = tasks;
  const now = Date.now();
  PEOPLE.forEach(p => {
    const c = chars[p.key];
    const mine = tasks.filter(t => t.assignee === p.key);
    const overdue = mine.filter(t => t.due && t.due < today());
    const upcoming = mine.filter(t => t.due).sort((a, b) => a.due.localeCompare(b.due))[0];

    let mood = 'idle', statusText = 'のんびり中', icon = '🥱';
    if (overdue.length) { mood = 'overdue'; statusText = '期限切れ対応中…！'; icon = '😰'; }
    else if (mine.length) { mood = 'working'; statusText = '作業中'; icon = '⌨️'; }

    if (mine.length < c.prevCount) {
      c.celebrateUntil = now + 2600;
      c.targetX = CELEBRATE_SPOT.x; c.targetY = CELEBRATE_SPOT.y;
    }
    c.prevCount = mine.length;
    c.mood = mood;
    c.taskIcon = icon;
    c.taskStatusText = statusText;
    refreshDisplay(p.key);

    const due = upcoming ? fmtDue(upcoming.due) : null;
    c.legendEl.querySelector('.legend-badges').innerHTML =
      `<span class="badge badge-count">${mine.length}件</span>` +
      (mine.length === 0
        ? `<span class="badge badge-ok">タスクなし</span>`
        : due ? `<span class="badge badge-due ${due.cls}">📅 ${due.label}</span>` : '');
  });
}

// タスク由来のアイコン/ステータスと、カレンダー由来の「会議中」を合成して表示する。
function refreshDisplay(key) {
  const c = chars[key];
  if (!c) return;
  const icon = c.inMeeting ? '📅' : c.taskIcon;
  const statusText = c.inMeeting ? '会議中' : c.taskStatusText;
  c.el.querySelector('.mood-icon').textContent = icon;
  c.legendEl.querySelector('.legend-status').textContent = statusText;
}

function assignMeetingSeat() {
  for (let i = 0; i < MEETING_SEATS.length; i++) {
    if (!usedMeetingSeats.has(i)) { usedMeetingSeats.add(i); return i; }
  }
  return null; // 全席埋まっている場合はテーブル付近に留まる(現状は連携1人のみなので発生しない)
}

function applyCalendarStatus(key, busy) {
  const c = chars[key];
  if (!c) return;
  if (busy && !c.inMeeting) {
    c.inMeeting = true;
    c.meetingSeat = assignMeetingSeat();
  } else if (!busy && c.inMeeting) {
    c.inMeeting = false;
    if (c.meetingSeat != null) { usedMeetingSeats.delete(c.meetingSeat); c.meetingSeat = null; }
  }
  refreshDisplay(key);
}

async function connectCalendar() {
  const btn = document.getElementById('cal-connect-btn');
  btn.disabled = true;
  btn.textContent = '連携中…';
  try {
    await ensureCalendarToken();
    btn.textContent = '✓ カレンダー連携済み';
    btn.classList.add('connected');
    pollCalendar();
    setInterval(pollCalendar, 2 * 60 * 1000);
  } catch (e) {
    alert('カレンダー連携に失敗しました: ' + e.message);
    btn.textContent = '📅 カレンダー連携';
    btn.disabled = false;
  }
}

async function pollCalendar() {
  if (!CALENDAR_PEOPLE.length) return;
  try {
    const emails = CALENDAR_PEOPLE.map(p => p.email);
    const busyMap = await fetchNowBusyMap(emails);
    CALENDAR_PEOPLE.forEach(p => applyCalendarStatus(p.key, !!busyMap[p.email]));
  } catch (e) {
    console.error('calendar poll failed', e);
  }
}

let lastTs = 0;
function tick(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.1);
  lastTs = ts;
  const now = Date.now();

  PEOPLE.forEach(p => {
    const c = chars[p.key];

    if (c.celebrateUntil && now > c.celebrateUntil) {
      c.celebrateUntil = 0;
    }

    if (!c.celebrateUntil) {
      if (c.inMeeting) {
        const seat = c.meetingSeat != null ? MEETING_SEATS[c.meetingSeat] : { x: 572, y: 350 };
        c.targetX = seat.x; c.targetY = seat.y;
      } else {
        c.targetX = p.deskX; c.targetY = p.standY;
      }
    }

    const dx = c.targetX - c.x, dy = c.targetY - c.y;
    const dist = Math.hypot(dx, dy);
    const walking = dist > 2;
    if (walking) {
      const step = SPEED * dt;
      if (step >= dist) { c.x = c.targetX; c.y = c.targetY; }
      else { c.x += (dx / dist) * step; c.y += (dy / dist) * step; }
    }

    c.el.style.left = c.x + 'px';
    c.el.style.top = c.y + 'px';
    c.el.classList.toggle('walking', walking);
    if (dx < -1) c.el.classList.add('facing-left');
    else if (dx > 1) c.el.classList.remove('facing-left');
    c.el.classList.toggle('celebrating', !!c.celebrateUntil);
    c.el.className = c.el.className.replace(/state-\S+/g, '').trim();
    c.el.classList.add('state-' + (c.inMeeting ? 'meeting' : c.mood));
    const moodIcon = c.el.querySelector('.mood-icon');
    moodIcon.classList.toggle('show', !walking && !c.celebrateUntil);
  });

  requestAnimationFrame(tick);
}

function initFirebase() {
  const { db, ref, onValue } = window._fb;
  onValue(ref(db, 'team2/tasks'), snap => {
    const val = snap.val();
    const tasks = val ? Object.values(val) : [];
    applyData(tasks);
  });
}

function renderPaperPile(count) {
  const pile = document.getElementById('paper-pile');
  const sheets = Math.max(3, Math.min(3 + count, 16));
  let html = '';
  for (let i = 0; i < sheets; i++) {
    const rot = (i % 2 === 0 ? 1 : -1) * (2 + (i % 5));
    const xOff = i % 3 === 0 ? -4 : i % 3 === 1 ? 4 : 0;
    html += `<div class="paper-sheet" style="bottom:${i * 6}px;left:${xOff}px;transform:rotate(${rot}deg);z-index:${i}"></div>`;
  }
  pile.innerHTML = html;
  pile.style.height = (sheets * 6 + 15) + 'px';
}

function renderWorkshop(orders) {
  const active = orders.filter(o => o.status === 'ordered' || o.status === 'in_progress').length;
  const delivered = orders.filter(o => o.status === 'delivered').length;
  renderPaperPile(active);
  const overloaded = active >= 4;
  document.getElementById('craftsman').classList.toggle('overloaded', overloaded);
  const msg = active === 0
    ? '涼しい顔で一息ついている。新しい発注を待っています。'
    : overloaded
      ? '机が書類で埋もれ気味…急ぎの発注は少し待たせるかも。'
      : '黙々と資料をこなしています。';
  document.getElementById('workshop-status').innerHTML =
    `対応中: <span class="num">${active}</span>件　/　納品済み: <span class="num">${delivered}</span>件<br>${msg}`;
}

function initWorkshop() {
  const { db, ref, onValue } = window._fb;
  onValue(ref(db, 'team2/orders'), snap => {
    const val = snap.val();
    renderWorkshop(val ? Object.values(val) : []);
  });
}

buildRoom();
requestAnimationFrame(tick);
if (window._fbReady) { initFirebase(); initWorkshop(); initSales(); }
else window.addEventListener('fb-ready', () => { initFirebase(); initWorkshop(); initSales(); });
</script>
